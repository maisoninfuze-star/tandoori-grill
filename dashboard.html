<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Kitchen Dashboard — Tandoor et Grille</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/dashboard.css?v=2" />
</head>
<body class="dash-body">

<!-- ===== LOGIN GATE ===== -->
<div class="gate" id="gate">
  <form class="gate__card" id="gateForm">
    <div class="gate__mono">T&amp;G</div>
    <h1>Kitchen Dashboard</h1>
    <p>Enter the staff passcode to see live orders.</p>
    <input type="password" id="gatePass" placeholder="Passcode" autocomplete="current-password" />
    <button type="submit" class="dbtn dbtn--primary" id="gateBtn">Enter</button>
    <span class="gate__err" id="gateErr" hidden>Wrong passcode — try again.</span>
  </form>
</div>

<!-- ===== APP ===== -->
<div class="dash" id="dash" hidden>
  <header class="dhead">
    <div class="dhead__brand">
      <span class="dhead__mono">T&amp;G</span>
      <div class="dhead__title"><strong>Kitchen</strong><span>Tandoor et Grille</span></div>
      <span class="dhead__live" id="liveDot" title="Live"><i></i> <em>Live</em></span>
    </div>
    <div class="dhead__stats">
      <div class="stat"><b id="stOrders">0</b><span>Orders today</span></div>
      <div class="stat"><b id="stActive">0</b><span>Active now</span></div>
      <div class="stat"><b id="stRevenue">$0</b><span>Revenue today</span></div>
    </div>
    <div class="dhead__tools">
      <button class="dbtn dbtn--ghost" id="soundBtn" title="Sound alerts" aria-pressed="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></svg>
        <span>Sound</span>
      </button>
      <button class="dbtn dbtn--ghost" id="logoutBtn">Log out</button>
    </div>
  </header>

  <main class="board" id="board">
    <section class="col" data-col="new">
      <header class="col__head"><h2>New</h2><span class="col__count" id="cNew">0</span></header>
      <div class="col__list" id="listNew"></div>
    </section>
    <section class="col" data-col="preparing">
      <header class="col__head"><h2>In the kitchen</h2><span class="col__count" id="cPrep">0</span></header>
      <div class="col__list" id="listPrep"></div>
    </section>
    <section class="col" data-col="ready">
      <header class="col__head"><h2>Ready for pickup</h2><span class="col__count" id="cReady">0</span></header>
      <div class="col__list" id="listReady"></div>
    </section>
  </main>
</div>

<script src="js/dashboard.js?v=3"></script>
</body>
</html>
